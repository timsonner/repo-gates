name: house-rules
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  house-rules:
    uses: timsonner/repo-gates/.github/workflows/house-rules.yml@<full-sha>
    with:
      gates_ref: <same full-sha>
